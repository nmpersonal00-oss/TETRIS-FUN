name: Mobile game layout and gestures
on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test touch game and menus across phone sizes
        run: python tests/test_iphone_layout.py
      - name: Test gentle level speed and selectable challenges without network access
        run: python tests/test_challenges.py
      - name: Upload mobile visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-game-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
