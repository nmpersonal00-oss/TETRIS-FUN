name: iPhone layout geometry
on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check iPhone layout and controls
        run: python tests/test_iphone_layout.py
