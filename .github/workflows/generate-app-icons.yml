name: Publish official app icons
on:
  push:
    paths:
      - 'assets/app-icon-source.b64'
      - 'scripts/generate_icons.py'
      - '.github/workflows/generate-app-icons.yml'
  pull_request:
    paths:
      - 'assets/app-icon-source.b64'
      - 'scripts/generate_icons.py'
      - '.github/workflows/generate-app-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install 'Pillow==11.3.0'
      - name: Generate four platform icon sizes
        run: python scripts/generate_icons.py
      - name: Commit generated icons to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apple-touch-icon.png assets/icon-192.png assets/icon-512.png assets/favicon-32.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish supplied pink Tetris app icon in all sizes"
            git push origin HEAD:main
          fi
