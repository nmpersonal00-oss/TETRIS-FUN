<style>

body,button,canvas,.shell,.stage,.rail{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
::selection{background:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-appearance:none;appearance:none;cursor:pointer}

/* Keep interactive statistics below iPhone system chrome.
   - Safari: honor the exposed top safe-area inset only when present.
   - Installed iOS Home Screen: some Safari/WebKit versions report 0 inset or
     omit display-mode:standalone. Reserve a conservative 76px clock/Dynamic
     Island clearance even on those versions.
   The horizontal and bottom margins stay at the user's existing tiny 3px. */
.shell{
  height:100vh;height:100dvh;min-height:0;width:100%;max-width:720px;
  margin:0 auto;position:relative;isolation:isolate;overflow:hidden;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  gap:clamp(3px,.45dvh,5px);
  padding:max(6px, env(safe-area-inset-top, 0px)) 3px 3px;
}
@media (display-mode:standalone) and (orientation:portrait){
  .shell{padding-top:max(76px, env(safe-area-inset-top, 0px))}
}
@media (orientation:portrait){
  /* navigator.standalone is supported on iOS releases where CSS display-mode
     detection is unreliable. It uses the exact same clearance as above. */
  html.ios-home-screen .shell{padding-top:max(76px, env(safe-area-inset-top, 0px))}
}
/* Compact information strip: Level opens Options, Next previews only one piece. */
.scorebar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(72px,.92fr);align-items:stretch;gap:clamp(4px,1.25vw,8px);width:100%;max-width:670px;height:clamp(46px,5.3dvh,51px);margin:0 auto;min-width:0}

.board-inner{position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;border:1px solid rgba(85,166,232,.45);background:#040b17;touch-action:none}

.preview-card{min-width:0;min-height:0;border-radius:11px;border:1px solid rgba(86,165,228,.7);background:linear-gradient(155deg,#14395d,#06142b 80%);box-shadow:inset 0 1px rgba(176,234,255,.16),0 0 14px rgba(21,116,209,.13)}
button.preview-card{border-color:#7fc9f6;box-shadow:inset 0 1px rgba(176,234,255,.2),0 0 14px rgba(55,169,244,.2)}
button.preview-card:active{background:#164d77;transform:scale(.985)}
.hold-box.unavailable{border-color:rgba(86,165,228,.53)}
.hold-box.unavailable .preview-subtitle{color:#7aadd0}
/* Keep the held tetromino at full opacity even when the swap is on cooldown. */
.preview-label{display:block;text-align:center;font-size:clamp(8px,2vw,10px);color:#b1dcf6;text-transform:uppercase;font-weight:850;letter-spacing:.1em;line-height:1.1}
.preview-subtitle{font-size:clamp(8px,2vw,10px);font-weight:750;color:#8ab9d9;letter-spacing:.04em;text-align:center;line-height:1.1}
.next-top{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:100%;padding:3px 2px;overflow:hidden}

.challenge-empty{height:clamp(190px,36dvh,300px);border:1px dashed rgba(92,172,224,.3);border-radius:14px;margin-top:23px;background:radial-gradient(ellipse at center,#15305555,#07112222)}
@media(max-width:360px){.shell{gap:3px}.scorebar{height:46px;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(65px,.85fr)}.stat-value{font-size:16px}.stat-label{font-size:8px}.next-top canvas{width:36px}.hold-bar{height:55px}}
@media(max-height:670px){.shell{gap:3px}.scorebar{height:44px}.stat-value{font-size:16px}.hold-bar{height:54px}.next-top canvas{width:36px}.menu-card{padding-top:18px}}
.leaderboard-page{display:grid;gap:13px}
.trophy-hero{display:grid;grid-template-columns:94px minmax(0,1fr);align-items:center;gap:10px;background:radial-gradient(circle at 25% 45%,#174b74 0%,#0b2341 46%,#06152b 100%);border:1px solid #458fba;border-radius:16px;padding:8px 10px;box-shadow:0 0 23px #0c66b24a,inset 0 0 18px #64c0f012}
.trophy-hero img{display:block;width:94px;height:94px;object-fit:contain;filter:drop-shadow(0 0 12px #33bfff)}
.trophy-hero strong{display:block;color:#d8f5ff;letter-spacing:.085em;font-size:15px}
.trophy-hero small{display:block;color:#a4c9e5;font-size:11px;line-height:1.6;margin-top:5px}
.board-form{display:flex;flex-direction:column;gap:7px}
.board-form label{font-size:11px;font-weight:800;color:#addbf8;letter-spacing:.12em;text-transform:uppercase}
.board-inputrow{display:flex;gap:8px}
.board-inputrow input{min-width:0;width:100%;min-height:45px;border-radius:11px;border:1px solid #498ab9;background:#071b30;color:#ebfaff;padding:10px 12px;font:700 15px system-ui;touch-action:manipulation;user-select:text;-webkit-user-select:text}
.board-inputrow button{padding:0 13px;white-space:nowrap;flex:0 0 auto;background:linear-gradient(125deg,#167db4,#153f79);border:1px solid #67c3fb;border-radius:11px;color:#ecfbff;font-size:12px;font-weight:850}
.board-status{font-size:11px;line-height:1.5;min-height:16px;color:#b4dbf4}
.board-status.error{color:#ffafb6}
.board-list{display:grid;gap:8px;list-style:none;padding:0;margin:0;max-height:min(30dvh,250px);overflow:auto;touch-action:pan-y}
.board-list li{border:1px solid #305e8d;border-radius:12px;background:linear-gradient(125deg,#103450,#08182e);display:grid;grid-template-columns:36px 1fr auto;gap:9px;align-items:center;padding:10px;min-height:54px}
.board-list li.first{border-color:#c8aa60;background:linear-gradient(120deg,#463824,#132843)}
.board-list li.me{box-shadow:inset 0 0 0 1px #67ccfa}
.board-rank{font-weight:900;color:#7ee1ff;font-size:18px}
.board-list .first .board-rank{color:#ffe58e}
.board-person{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:850;font-size:13px}
.board-person-wrap{min-width:0;display:grid;gap:3px}
.board-player-level{color:#86d9fa;font-size:11px;letter-spacing:.06em;font-weight:800}
.board-best-wrap{display:grid;justify-items:end;gap:3px}
.board-best-label{color:#9dbed9;font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.board-points{font-variant-numeric:tabular-nums;color:#e2f7ff;font-weight:900;font-size:14px}
.challenge-heading{font-weight:900;font-size:12px;letter-spacing:.11em;color:#bae8ff;text-align:center;margin:5px 0 10px}
.challenge-progress{list-style:none;padding:0;margin:0;display:grid;gap:9px;max-height:min(32dvh,250px);overflow:auto;touch-action:pan-y}
.challenge-progress li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid #35668a;background:linear-gradient(130deg,#123a5b,#06172b)}
.challenge-progress li:first-child{border-color:#b4a462}
.challenge-player{font-weight:850;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.challenge-numbers{display:grid;gap:3px;text-align:right;flex:0 0 auto;font-size:11px;color:#9dbed9}
.challenge-numbers strong{color:#82e4ff;font-size:15px}

@media(prefers-reduced-motion:reduce){.clear-toast.show{animation-duration:.01ms}*{transition:none!important}}
</style></style>

<body>

<main class="shell" aria-label="Glow Stack block puzzle">
  <section class="scorebar" aria-label="Game statistics and next piece">
    <button class="stat" type="button" id="levelButton" aria-haspopup="dialog" aria-controls="menuScreen" aria-label="Level and game options">
      <span class="menu-chevron" aria-hidden="true">☰</span>
      <span class="stat-label">Level</span><strong class="stat-value" id="level">1</strong>
    </button>
    <div class="stat"><span class="stat-label">Score</span><strong class="stat-value" id="score">0</strong></div>
    <div class="stat"><span class="stat-label">Best</span><strong class="stat-value" id="best">0</strong></div>
    <div class="preview-card next-top">
      <span class="preview-label">Next</span>
      <canvas id="nextOne" width="120" height="100" aria-label="Next block preview"></canvas>
    </div>
  </section>
  <section class="stage" aria-label="Game board">
    <div class="board-panel">
      <div class="board-inner">
        <canvas id="board" width="300" height="600" role="img" aria-label="Tetris game board. Drag side to side to move, tap to rotate, drag downward to lower a piece, or flick downward to drop it."></canvas>
        <div class="clear-toast" id="clearToast" aria-live="off" aria-hidden="true"></div>
        <div class="overlay" id="overlay">
          <span class="overlay-title" id="overlayTitle" hidden></span>
          <button type="button" id="playButton" class="play-btn">PLAY</button>
          <span class="gesture-hint">Drag to move · Tap to rotate<br>Swipe down to drop</span>
        </div>
      </div>
    </div>
  </section>
  <section class="hold-strip" aria-label="Hold piece">
    <button class="preview-card hold-bar" id="holdBox" type="button" aria-label="Hold or swap current piece" title="Hold or swap piece">
      <span class="hold-copy"><span class="preview-label">Hold</span><span class="preview-subtitle">Tap to swap</span></span>
      <canvas id="held" width="240" height="80" aria-hidden="true"></canvas>
    </button>
  </section>
  <section class="menu-screen" id="menuScreen" role="dialog" aria-modal="true" aria-labelledby="menuTitle" hidden>
    <div class="menu-card">
      <button class="menu-back" id="menuBack" type="button" aria-label="Back to options" hidden>←</button>
      <button class="menu-close" id="menuClose" type="button" aria-label="Close menu and resume game">×</button>
      <h2 class="menu-title" id="menuTitle">OPTIONS</h2>
      <div id="optionsPage">
        <p class="menu-note">Game paused while this menu is open</p>
        <div class="menu-buttons">
          <button class="menu-choice" type="button" id="restartButton">↻ &nbsp; Restart Level</button>
          <button class="menu-choice" type="button" id="resetButton">⟲ &nbsp; Restart at Level 1</button>
          <button class="menu-choice secondary" type="button" id="leaderboardButton">🏆 &nbsp; Leaderboard</button>
          <button class="menu-choice secondary" type="button" id="challengesButton">◇ &nbsp; Challenges</button>
        </div>
      </div>
      <div id="challengesPage" hidden aria-label="Challenges page">
        <div class="challenge-heading">CURRENT LEVELS</div>
        <div id="challengeStatus" class="board-status" role="status" aria-live="polite">Loading levels…</div>
        <ol id="challengeProgressList" class="challenge-progress" aria-label="Player level comparison"></ol>
        <div class="challenge-empty" aria-label="Future challenges">More challenges coming soon</div>
      </div>
      <div id="leaderboardPage" class="leaderboard-page" hidden aria-label="Shared leaderboard">
        <div class="trophy-hero"><img src="./assets/neon-trophy.svg" alt="Gold and cyan neon trophy with glowing blocks">
          <div><strong>TETRIS CHAMPIONS</strong><small>Two phones. One leaderboard.<br>Highest score takes the crown.</small></div>
        </div>
        <div class="board-form">
          <label for="playerNameInput">Your player name</label>
          <div class="board-inputrow">
            <input type="text" id="playerNameInput" maxlength="18" autocomplete="nickname" placeholder="Choose a name" pattern="[A-Za-z0-9 _-]{2,18}">
            <button type="button" id="savePlayerButton">SAVE NAME</button>
          </div>
          <div id="boardStatus" class="board-status" role="status" aria-live="polite">Connecting to the leaderboard…</div>
        </div>
        <ol id="leaderboardList" class="board-list" aria-label="Best scores"></ol>
      </div>
    </div>
  </section>
</main>
</main>
<script>
(()=>{'use strict';
// Apple's Home Screen flag is a second detection path for older iOS versions.
if(window.navigator.standalone===true)document.documentElement.classList.add('ios-home-screen');
const W=10,H=20,CELL=30;
const STORE='glow-stack-save-v3',BEST='glow-stack-best-v3';
const OLD_SAVES=['glow-stack-save-v2','glow-stack-save-v1'];
const OLD_BEST=['glow-stack-best-v2','glow-stack-best-v1'];
const SHAPES={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
const COLORS={I:'#62efff',O:'#ffcd79',T:'#c1a0ff',S:'#69edc2',Z:'#ff718c',J:'#7199ff',L:'#ffad75'};
const names=Object.keys(SHAPES), $=id=>document.getElementById(id);
const canvas=$('board'),ctx=canvas.getContext('2d',{alpha:false});
const previews=[$('held'),$('nextOne')].map(el=>el.getContext('2d'));
let board,active,queue=[],bag=[],held=null,holdUsed=false,score=0,best=0,level=1,lines=0;
let checkpointScore=0,checkpointLines=0,status='ready',fallTime=0,lockTime=0,lockResets=0,saveTime=0,lastFrame=0;
let effect=null,particles=[],effectTime=0;
let menuOpen=false,menuWasPlaying=false;
const LB_URL='https://gtcybnvjdcmuzegxwiic.supabase.co';
const LB_PUBLIC_KEY='sb_publishable_GBuQ25Z5CNBwW3iYEGLb8A_VEsxwReg';
let lbClient=null,lbUser=null,lbUsername='',lbBest=0,lbSyncPending=false,lbSending=false,lbLastSent=0,lbLastLevelSent=1,lbLastFetch=0,lbLoading=null,lbOpen=false;
let lbRows=[];

const blank=()=>Array.from({length:H},()=>Array(W).fill(null));
const validName=n=>typeof n==='string'&&Object.prototype.hasOwnProperty.call(SHAPES,n);
function bagShuffle(){const a=names.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function take(){if(!bag.length)bag=bagShuffle();return bag.pop()}
function fillQueue(){while(queue.length<4)queue.push(take())}
function copyShape(name){return SHAPES[name].map(r=>r.slice())}
function collide(shape,x,y){for(let r=0;r<shape.length;r++)for(let c=0;c<shape[r].length;c++)if(shape[r][c]){const xx=x+c,yy=y+r;if(xx<0||xx>=W||yy>=H||(yy>=0&&board[yy][xx]))return true}return false}
function grounded(){return !!active&&collide(active.shape,active.x,active.y+1)}
function makeActive(name){const shape=copyShape(name);active={name,shape,x:Math.floor((W-shape[0].length)/2),y:0};fallTime=0;lockTime=0;lockResets=0;if(collide(shape,active.x,active.y)){status='over';save()}}
function spawn(){fillQueue();makeActive(queue.shift());fillQueue()}
function fresh(lvl=1,points=0,completedLines=(lvl-1)*10){
  board=blank();queue=[];bag=[];held=null;holdUsed=false;
  level=lvl;score=points;lines=completedLines;checkpointScore=points;checkpointLines=completedLines;
  fallTime=0;lockTime=0;lockResets=0;effect=null;particles=[];status='ready';
  $('clearToast').classList.remove('show');spawn();refresh();save();
  if(lbUsername&&lbUser)queueLeaderboardScore();
}
// The Best tile is the device's stored personal record, including runs played
// before the player signed up. The online leaderboard must represent that SAME
// record, not only the current run (which may be much lower).
function adoptPersonalBest(onlineScore=0){
  const safeOnline=Number.isSafeInteger(Number(onlineScore))?Math.max(0,Number(onlineScore)):0;
  lbBest=Math.max(lbBest,best,score,safeOnline);

function leaderboardError(e){
  if(!e)return 'Could not connect to leaderboard.';
  const msg=String(e.message||e);
  const code=String(e.code||'').toLowerCase();
  // Prefer Supabase's structured Auth error codes over broad word matches.
  // "anonymous" in an error can refer to a CAPTCHA challenge, NOT a
  // disabled anonymous provider. Keep the two cases distinct.
  if(code==='anonymous_provider_disabled'||/anonymous sign-ins? (are |is )?disabled/i.test(msg)){
    return 'Supabase is rejecting anonymous sign-ins. In Wifey & Hubby → Authentication → Providers, switch on Anonymous Sign-Ins, SAVE, reload that settings page to verify it stayed on, then try Save Name again.';
  }
  if(/captcha|turnstile|hcaptcha|bot protection/i.test(code+' '+msg)){
    return 'Supabase requires CAPTCHA, but this game does not yet show a CAPTCHA challenge. The game needs a CAPTCHA integration before registration can work. Check Authentication → Protection.';
  }
  if(code==='signup_disabled'||/signups? (are |is )?disabled/i.test(msg)){
    return 'Supabase signup is disabled. Check project Authentication → Providers and signup settings.';
  }
  if(/duplicate|unique|23505/i.test(code+' '+msg))return 'That name is already taken. Choose another name.';
  if(/network|failed to fetch|fetch failed/i.test(code+' '+msg))return 'Connection unavailable. Try again when connected to the internet.';
  if(/rate.?limit|too many requests/i.test(code+' '+msg))return 'Too many sign-in attempts. Wait before trying again.';
  // If Supabase returns an unfamiliar error, show what it actually said,
  // rather than claiming the user needs to enable a provider.
  return 'Supabase: '+msg.slice(0,190)+(code?' ['+code.slice(0,45)+']':'');

async function initializeLeaderboard(createPlayer=false){

  if(lbLoading){
    await lbLoading;
    if(lbUser||!createPlayer)return;
  }
  lbLoading=(async()=>{
    // The CDN library is optional to offline gameplay. The menu reports an
    // actionable error when not yet loaded instead of affecting the game.
    if(!window.supabase||!window.supabase.createClient)throw Error('Leaderboard library is not loaded. Connect to the internet and reopen the menu.');
    if(!lbClient)lbClient=window.supabase.createClient(LB_URL,LB_PUBLIC_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'glow-stack-supabase-auth'}
    });
    let {data:{session},error}=await lbClient.auth.getSession();
    if(error)throw error;
    if(!session){
      // Only tap Save Name can create a Supabase identity. Opening a menu,
      // exploring rankings or opening Challenges must never add accounts.
      if(!createPlayer)return;
      const sign=await lbClient.auth.signInAnonymously();
      if(sign.error)throw sign.error;
      session=sign.data.session;
    }
    lbUser=session?.user?.id;
    if(!lbUser)throw Error('Unable to create player identity.');
    const {data, error:profileError}=await lbClient.from('glow_stack_leaderboard')
      .select('username,best_score,current_level').eq('user_id',lbUser).maybeSingle();
    if(profileError)throw profileError;
    if(data){
      lbUsername=data.username;
      const storedOnlineBest=Math.max(0,Number(data.best_score)||0);
      lbLastSent=storedOnlineBest; // Last value confirmed in Supabase, NOT local best
      lbLastLevelSent=Math.max(1,Number(data.current_level)||1);
      adoptPersonalBest(storedOnlineBest);
      refresh(); // Refresh the Best tile if the online record was higher
      if(lbBest>lbLastSent||level!==lbLastLevelSent)queueLeaderboardScore();
    }
    $('playerNameInput').value=lbUsername;
  })();
  try{await lbLoading}finally{lbLoading=null}
}

  const name=$('playerNameInput').value.trim().replace(/\s+/g,' ');
  if(!/^[A-Za-z0-9 _-]{2,18}$/.test(name)){
    setBoardStatus('Use 2–18 letters, numbers, spaces, underscores or hyphens.',true);return;
  }
  $('savePlayerButton').disabled=true;
  try{
    setBoardStatus('Saving your player name…');
    await initializeLeaderboard(true);
    // Import the Best tile's saved record when registering a name, even if
    // the current run only has a few points.
    adoptPersonalBest();
    const {error}=await lbClient.from('glow_stack_leaderboard').upsert({
      user_id:lbUser,username:name,best_score:lbBest,current_level:level
    },{onConflict:'user_id'});
    if(error)throw error;
    lbUsername=name;
    lbLastLevelSent=level;
    lbLastSent=Math.max(lbLastSent,lbBest);
    try{localStorage.setItem('glow-stack-player-name-v1',name)}catch(_){}
    await fetchLeaderboard();
  }catch(e){setBoardStatus(leaderboardError(e),true)}
  finally{$('savePlayerButton').disabled=false}
}
function queueLeaderboardScore(){
  if(lbSyncPending||!lbUsername||!lbClient||!lbUser)return;
  lbSyncPending=true;
  // Coalesce rapid score and level changes. One request at a time prevents an
  // older level update arriving after a newer one and overwriting the record.
  setTimeout(async()=>{
    lbSyncPending=false;
    if(!lbUsername||!lbClient||!lbUser)return;
    if(lbSending){queueLeaderboardScore();return}
    const scoreToSend=lbBest,levelToSend=level;
    if(scoreToSend<=lbLastSent&&levelToSend===lbLastLevelSent)return;
    lbSending=true;let succeeded=false;
    try{
      const {data,error}=await lbClient.from('glow_stack_leaderboard')
        .update({best_score:scoreToSend,current_level:levelToSend})
        .eq('user_id',lbUser).select('best_score,current_level').single();
      if(error)throw error;
      lbLastSent=Math.max(lbLastSent,Number(data.best_score)||0);
      lbLastLevelSent=Math.max(1,Number(data.current_level)||levelToSend);
      succeeded=true;
      if(lbOpen)await fetchLeaderboard();
    }catch(e){if(lbOpen)setBoardStatus(leaderboardError(e),true)}
    finally{
      lbSending=false;
      if(succeeded&&(lbBest>lbLastSent||level!==lbLastLevelSent))queueLeaderboardScore();
    }
  },900);
}
window.addEventListener('online',()=>queueLeaderboardScore());
async function refreshLeaderboardIfNeeded(){
  if(!lbOpen||!lbClient||!lbUser||Date.now()-lbLastFetch<10000)return;
  try{
    adoptPersonalBest();
    if(lbBest>lbLastSent||level!==lbLastLevelSent)queueLeaderboardScore();
    await fetchLeaderboard();
  }catch(e){setBoardStatus(leaderboardError(e),true)}
}
// Refresh online rankings while the menu is visible, across both phones.
setInterval(()=>{void refreshLeaderboardIfNeeded()},5000);

function openMenu(){
  if(menuOpen)return;
  menuWasPlaying=status==='playing'||status==='clearing';
  menuOpen=true;
  if(menuWasPlaying){status='paused';refresh();save()}
  showMenuPage('options');
  $('menuScreen').hidden=false;
  $('menuClose').focus({preventScroll:true});
}
function showMenuPage(page){
  $('menuTitle').textContent=page==='challenges'?'CHALLENGES':page==='leaderboard'?'LEADERBOARD':'OPTIONS';
  $('optionsPage').hidden=page!=='options';
  $('challengesPage').hidden=page!=='challenges';
  $('leaderboardPage').hidden=page!=='leaderboard';
  $('menuBack').hidden=page==='options';
  lbOpen=page==='leaderboard'||page==='challenges';
  if(page==='leaderboard')$('playerNameInput').value=lbUsername;
  if(lbOpen)void openLeaderboard();
}
function closeMenu(resume=true){
  if(!menuOpen)return;
  menuOpen=false;lbOpen=false;$('menuScreen').hidden=true;
  if(resume&&menuWasPlaying&&status==='paused')begin();
  menuWasPlaying=false;
  $('levelButton').focus({preventScroll:true});
}
$('levelButton').addEventListener('click',openMenu);
$('menuClose').addEventListener('click',()=>closeMenu());
$('menuBack').addEventListener('click',()=>showMenuPage('options'));
$('challengesButton').addEventListener('click',()=>showMenuPage('challenges'));
$('leaderboardButton').addEventListener('click',()=>showMenuPage('leaderboard'));
$('savePlayerButton').addEventListener('click',()=>{void saveLeaderboardName()});
$('playerNameInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();void saveLeaderboardName()}
});
$('restartButton').addEventListener('click',()=>{
  closeMenu(false);
  touch=null;fresh(level,checkpointScore,checkpointLines);begin();
});
$('resetButton').addEventListener('click',()=>{
  closeMenu(false);
  touch=null;fresh();begin();
});
// A hidden Home Screen app should not keep playing in the background.
document.addEventListener('visibilitychange',()=>{
  touch=null;
  if(document.hidden&&(status==='playing'||status==='clearing')){
    status='paused';refresh();save();
  }
});
window.addEventListener('pagehide',save);
// The board follows the stage that CSS makes available. No viewport override,
// status bar mode switch, physical screen.height or forced device dimensions.
function fit(){
  const stage=document.querySelector('.stage');
  const panel=document.querySelector('.board-panel');
  const hold=document.querySelector('.hold-bar');
  const sw=stage.clientWidth,sh=stage.clientHeight;
  if(!sw||!sh)return;
  // The grid remains 10 columns by 20 rows. A slightly wider presentation
  // (1:1.86 instead of 1:2) fills narrow phone screens more completely without
  // changing collisions, piece rotation, movement or canvas coordinates.
  const displayRatio=1.86;
  const width=Math.max(1,Math.floor(Math.min(540,sw-2,(sh-2)/displayRatio)));
  panel.style.width=width+'px';panel.style.height=width*displayRatio+'px';
  hold.style.width=width+'px';
}
let fitScheduled=false;
function scheduleFit(){
  if(fitScheduled)return;
  fitScheduled=true;
  requestAnimationFrame(()=>{fitScheduled=false;fit()});
}
if(window.ResizeObserver){
  const obs=new ResizeObserver(scheduleFit);
  obs.observe(document.querySelector('.stage'));
}
window.addEventListener('resize',scheduleFit);
window.addEventListener('pageshow',scheduleFit);
window.addEventListener('orientationchange',scheduleFit);
window.visualViewport?.addEventListener('resize',scheduleFit);
if(!load())fresh();refresh();fit();requestAnimationFrame(frame);
})();
</script>
